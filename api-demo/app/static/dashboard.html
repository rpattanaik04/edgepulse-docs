<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdgePulse Dashboard</title>
<style>
  :root {
    --ink: #1f2933; --muted: #52606d; --line: #d9e2ec; --bg: #f5f7fa; --card: #ffffff;
    --accent: #3f51b5; --accent-dark: #303f9f;
    --green: #1b7f4b; --green-bg: #e3f6ec; --amber: #92600a; --amber-bg: #fdf1d8;
    --red: #b42318; --red-bg: #fde8e6; --blue: #1d5fa8; --blue-bg: #e4eefb; --grey: #52606d; --grey-bg: #e9edf2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 56px; background: var(--accent); color: #fff; }
  .brand { font-weight: 600; font-size: 18px; letter-spacing: .2px; }
  .brand small { font-weight: 400; opacity: .8; margin-left: 8px; font-size: 13px; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
  .tile .n { font-size: 28px; font-weight: 600; line-height: 1.1; }
  .tile .l { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover, tbody tr.selected { background: #eef1fb; }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .online, .acknowledged { color: var(--green); background: var(--green-bg); }
  .offline { color: var(--grey); background: var(--grey-bg); }
  .maintenance, .warning { color: var(--amber); background: var(--amber-bg); }
  .critical { color: var(--red); background: var(--red-bg); }
  .info { color: var(--blue); background: var(--blue-bg); }
  .open { color: var(--red); background: var(--red-bg); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar .spacer { flex: 1; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  input, select { font: inherit; padding: 7px 10px; border: 1px solid #b6c2cf; border-radius: 6px; background: #fff; color: var(--ink); min-width: 0; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button:hover { background: var(--accent-dark); }
  button.secondary { background: #fff; color: var(--accent); }
  button.secondary:hover { background: #eef1fb; }
  button.danger { background: #fff; color: var(--red); border-color: var(--red); }
  button.danger:hover { background: var(--red-bg); }
  button.small { padding: 3px 10px; font-size: 13px; }
  header.top button { background: transparent; border-color: rgba(255,255,255,.7); }
  header.top button:hover { background: rgba(255,255,255,.15); }
  .signin { max-width: 380px; margin: 72px auto; }
  .signin input { width: 100%; }
  .signin button { width: 100%; margin-top: 16px; }
  .msg { padding: 8px 12px; border-radius: 6px; margin: 0 0 12px; font-size: 14px; }
  .msg.error { background: var(--red-bg); color: var(--red); }
  .msg.ok { background: var(--green-bg); color: var(--green); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 24px; margin-bottom: 8px; }
  .kv dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; margin-top: 8px; }
  .kv dd { margin: 0; }
  .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .form-row > div { flex: 1 1 180px; }
  .form-row input, .form-row select { width: 100%; }
  .hint { color: var(--muted); font-size: 13px; }
  .over { color: var(--red); font-weight: 600; }
  code { background: var(--grey-bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .empty { color: var(--muted); padding: 12px 0; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">EdgePulse<small>Dashboard</small></div>
  <div id="session"></div>
</header>
<main id="app"></main>

<script>
"use strict";
const API = "/api/v1";
let token = null;
const state = { devices: [], alerts: [], filter: "all", selected: null, showForm: false, notice: null };

// ---------- helpers ----------
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) node.append(c instanceof Node ? c : document.createTextNode(c ?? ""));
  return node;
}
const fmt = (t) => (t ? t.replace("T", " ").slice(0, 19) + " UTC" : "Never");
const badge = (v) => el("span", { class: "badge " + v }, v);

async function api(method, path, body) {
  const headers = {};
  if (token) headers.Authorization = "Bearer " + token;
  if (body) headers["Content-Type"] = "application/json";
  const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401 && token) { signOut("Your session expired. Sign in again."); throw new Error("expired"); }
  const data = res.status === 204 ? null : await res.json();
  if (!res.ok) {
    const err = new Error(data.error.message);
    err.details = data.error.details || [];
    throw err;
  }
  return data;
}

function show(...nodes) { document.getElementById("app").replaceChildren(...nodes); }
function setSession() {
  const s = document.getElementById("session");
  s.replaceChildren(token ? el("button", { onclick: () => signOut() }, "Sign out") : "");
}

// ---------- sign in ----------
function renderSignIn(message) {
  const form = el("form", { class: "card signin", autocomplete: "off" },
    el("h1", {}, "Sign in"),
    message ? el("p", { class: "msg error", role: "alert" }, message) : "",
    el("label", { for: "cid" }, "Client ID"),
    el("input", { id: "cid", name: "client_id", value: "demo-client", required: true }),
    el("label", { for: "cs" }, "Client secret"),
    el("input", { id: "cs", name: "client_secret", type: "password", value: "demo-secret", required: true }),
    el("button", { type: "submit" }, "Sign in"),
    el("p", { class: "hint" }, "Demo credentials are pre-filled."));
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const r = await api("POST", "/auth/token", {
        client_id: form.client_id.value, client_secret: form.client_secret.value });
      token = r.access_token;
      setSession();
      await load();
    } catch (err) { renderSignIn(err.message); }
  });
  setSession();
  show(form);
}

function signOut(message) {
  token = null; state.selected = null; state.showForm = false; state.notice = null;
  renderSignIn(message);
}

// ---------- data ----------
async function load() {
  const [d, a] = await Promise.all([api("GET", "/devices?limit=100"), api("GET", "/alerts")]);
  state.devices = d.items; state.alerts = a.items;
  if (state.selected) {
    state.selected = state.devices.find((x) => x.id === state.selected.id) || null;
    if (state.selected) state.readings = (await api("GET", `/devices/${state.selected.id}/telemetry?limit=10`)).items;
  }
  renderDashboard();
}

async function select(id) {
  state.selected = state.devices.find((d) => d.id === id);
  state.readings = (await api("GET", `/devices/${id}/telemetry?limit=10`)).items;
  state.notice = null;
  renderDashboard();
}

// ---------- views ----------
function tile(n, l) { return el("div", { class: "tile" }, el("div", { class: "n" }, String(n)), el("div", { class: "l" }, l)); }

function renderDashboard() {
  const count = (s) => state.devices.filter((d) => d.status === s).length;
  const openAlerts = state.alerts.filter((a) => a.state === "open").length;
  const visible = state.devices.filter((d) => state.filter === "all" || d.status === state.filter);

  const filter = el("select", { id: "filter", "aria-label": "Filter devices by status",
      onchange: (e) => { state.filter = e.target.value; renderDashboard(); } },
    ...["all", "online", "offline", "maintenance"].map((v) =>
      el("option", { value: v, selected: v === state.filter }, v === "all" ? "All statuses" : v)));

  const devicesCard = el("section", { class: "card", "aria-labelledby": "dev-h" },
    el("h2", { id: "dev-h" }, "Devices"),
    el("div", { class: "toolbar" }, filter,
      el("span", { class: "spacer" }),
      el("button", { class: "secondary", onclick: () => load() }, "Refresh"),
      el("button", { onclick: () => { state.showForm = !state.showForm; renderDashboard(); } }, "Add device")),
    state.showForm ? deviceForm() : "",
    visible.length ? el("table", {},
      el("thead", {}, el("tr", {}, ...["Name", "Site", "Protocol", "Status", "Firmware", "Last seen"].map((h) => el("th", {}, h)))),
      el("tbody", {}, ...visible.map((d) => el("tr", { class: "row" + (state.selected?.id === d.id ? " selected" : ""), tabindex: "0",
          onclick: () => select(d.id), onkeydown: (e) => { if (e.key === "Enter") select(d.id); } },
        el("td", {}, d.name), el("td", {}, d.site), el("td", {}, d.protocol.toUpperCase()),
        el("td", {}, badge(d.status)), el("td", {}, d.firmware), el("td", {}, fmt(d.last_seen))))))
      : el("p", { class: "empty" }, "No devices match this filter."));

  const alertsCard = el("section", { class: "card", "aria-labelledby": "alt-h" },
    el("h2", { id: "alt-h" }, "Alerts"),
    state.alerts.length ? el("table", {},
      el("thead", {}, el("tr", {}, ...["Severity", "State", "Device", "Message", "Raised", ""].map((h) => el("th", {}, h)))),
      el("tbody", {}, ...state.alerts.map((a) => el("tr", {},
        el("td", {}, badge(a.severity)), el("td", {}, badge(a.state)), el("td", {}, a.device_id),
        el("td", {}, a.message), el("td", {}, fmt(a.raised_at)),
        el("td", {}, a.state === "open"
          ? el("button", { class: "small secondary", onclick: () => acknowledge(a.id) }, "Acknowledge")
          : el("span", { class: "hint" }, "by " + a.acknowledged_by))))))
      : el("p", { class: "empty" }, "No alerts."));

  show(
    el("h1", {}, "Overview"),
    state.notice ? el("p", { class: "msg " + state.notice.kind, role: "status" }, state.notice.text) : "",
    el("div", { class: "tiles" }, tile(count("online"), "Online"), tile(count("offline"), "Offline"),
      tile(count("maintenance"), "Maintenance"), tile(openAlerts, "Open alerts")),
    devicesCard, state.selected ? detailCard() : "", alertsCard);
}

function detailCard() {
  const d = state.selected;
  const status = el("select", { id: "newstatus", "aria-label": "Device status" },
    ...["online", "offline", "maintenance"].map((v) => el("option", { value: v, selected: v === d.status }, v)));
  return el("section", { class: "card", "aria-labelledby": "det-h" },
    el("h2", { id: "det-h" }, "Device details: " + d.name),
    el("dl", { class: "kv grid2" },
      ...[["ID", d.id], ["Site", d.site], ["Protocol", d.protocol.toUpperCase()], ["Firmware", d.firmware],
          ["Last seen", fmt(d.last_seen)], ["Registered", fmt(d.created_at)]]
        .map(([k, v]) => el("div", {}, el("dt", {}, k), el("dd", {}, v)))),
    el("h2", {}, "Latest readings"),
    state.readings.length ? el("table", {},
      el("thead", {}, el("tr", {}, ...["Time", "Temperature (°C)", "Vibration (mm/s)", "Pressure (kPa)"].map((h) => el("th", {}, h)))),
      el("tbody", {}, ...state.readings.map((r) => el("tr", {},
        el("td", {}, fmt(r.timestamp)), el("td", {}, r.temperature_c.toFixed(1)),
        el("td", { class: r.vibration_mm_s > 5 ? "over" : "" }, r.vibration_mm_s.toFixed(1)),
        el("td", {}, r.pressure_kpa.toFixed(1))))))
      : el("p", { class: "empty" }, "This device has not sent any readings."),
    el("p", { class: "hint" }, "Vibration above 5.0 mm/s raises a critical alert."),
    el("div", { class: "toolbar" },
      el("label", { for: "newstatus", style: "margin:0" }, "Status"), status,
      el("button", { class: "secondary", onclick: () => updateStatus(d.id, status.value) }, "Save status"),
      el("span", { class: "spacer" }),
      el("button", { class: "danger", onclick: () => remove(d) }, "Delete device")));
}

function deviceForm() {
  const formError = el("p", { class: "msg error", role: "alert", hidden: true });
  const form = el("form", { class: "card", style: "background:#fafbfd" },
    el("h2", {}, "Add device"),
    formError,
    el("div", { class: "form-row" },
      el("div", {}, el("label", { for: "f-name" }, "Name"), el("input", { id: "f-name", name: "name", placeholder: "Boiler Gateway 07" })),
      el("div", {}, el("label", { for: "f-site" }, "Site"), el("input", { id: "f-site", name: "site", placeholder: "Pune Plant" })),
      el("div", {}, el("label", { for: "f-proto" }, "Protocol"),
        el("select", { id: "f-proto", name: "protocol" }, ...["mqtt", "opcua", "modbus"].map((v) => el("option", { value: v }, v.toUpperCase())))),
      el("div", {}, el("label", { for: "f-fw" }, "Firmware"), el("input", { id: "f-fw", name: "firmware", value: "1.0.0" }))),
    el("div", { class: "toolbar", style: "margin-top:12px" },
      el("button", { type: "submit" }, "Register"),
      el("button", { type: "button", class: "secondary", onclick: () => { state.showForm = false; renderDashboard(); } }, "Cancel")));
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const d = await api("POST", "/devices", { name: form.name.value, site: form.site.value,
        protocol: form.protocol.value, firmware: form.firmware.value });
      state.showForm = false; state.notice = { kind: "ok", text: `Registered ${d.name} (${d.id}).` };
      await load();
    } catch (err) {
      const why = (err.details || []).map((x) => `${x.field}: ${x.issue}`).join("; ");
      formError.textContent = err.message + (why ? " " + why : "");
      formError.hidden = false;
    }
  });
  return form;
}

// ---------- actions ----------
async function acknowledge(id) {
  try { await api("POST", `/alerts/${id}/acknowledge`); state.notice = { kind: "ok", text: `Alert ${id} acknowledged.` }; await load(); }
  catch (err) { state.notice = { kind: "error", text: err.message }; renderDashboard(); }
}
async function updateStatus(id, status) {
  try { await api("PATCH", `/devices/${id}`, { status }); state.notice = { kind: "ok", text: `Status set to ${status}.` }; await load(); }
  catch (err) { state.notice = { kind: "error", text: err.message }; renderDashboard(); }
}
async function remove(d) {
  if (!confirm(`Delete ${d.name}? This also deletes its readings and alerts.`)) return;
  try { await api("DELETE", `/devices/${d.id}`); state.selected = null; state.notice = { kind: "ok", text: `Deleted ${d.name}.` }; await load(); }
  catch (err) { state.notice = { kind: "error", text: err.message }; renderDashboard(); }
}

renderSignIn();
</script>
</body>
</html>
