site_name: EdgePulse Documentation
site_description: Documentation set for EdgePulse, a fictional IIoT edge device monitoring platform.
site_author: Rakesh Pattanaik
site_url: https://rpattanaik04.github.io/edgepulse-docs/
repo_url: https://github.com/rpattanaik04/edgepulse-docs
repo_name: rpattanaik04/edgepulse-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Product:
      - Overview: overview/index.md
  - Get started:
      - Quick start: quick-start/index.md
      - Installation guide: installation/index.md
  - Guides:
      - Dashboard user guide: user-guide/index.md
      - Administrator guide: admin-guide/index.md
  - API:
      - Authentication guide: api/authentication.md
      - Reference: api/reference.md
      - Developer guide: developer-guide/index.md
  - Help center:
      - FAQ: help-center/faq.md
      - Glossary: help-center/glossary.md
      - Troubleshooting guide: troubleshooting/index.md
  - Releases:
      - Release notes: release-notes/index.md
      - Upgrade guide 1.1 to 1.2: migration/upgrade-1.1-to-1.2.md
  - Integration:
      - MQTT integration: integration/mqtt.md
  - Structured authoring:
      - DITA sample: dita-sample/index.md
  - Contributing:
      - Contribution guide: contributing/index.md
      - Docs-as-Code pipeline: contributing/pipeline.md
      - Documentation style guide: contributing/style-guide.md

validation:
  anchors: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
